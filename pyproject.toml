[project]
name = "wkhelper"
version = "1.1.0"
description = "网课学习助手"
readme = "README.md"
requires-python = ">=3.12"
scripts = { wkhelper = "wkhelper.main:main" }
dependencies = [
  "cyclopts>=5.2.0",
  "keyring>=25.7.0",
  "curl_cffi>=0.16.3,<0.17.0",
  "fonttools>=4.67.0",
  "markdownify>=1.2.3",
  "pydantic>=2.14.1,<3",
]

[dependency-groups]
dev = [
  "prek>=0.5.7",
  "pyrefly>=1.4.0",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "ruff>=0.17.1",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.commitizen]
name = "cz_gitmoji"

[tool.pyright]
pythonVersion = "3.12"

[tool.pyrefly]
project-includes = ["wkhelper","tests"]
python-version = "3.12"

[tool.pytest]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 140

[tool.ruff.lint]
select = [
  "E",
  "F",
  "B",
  "UP",
  "I",
  "Q",
  "PERF",
]
pydocstyle = { convention = "google" }

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "wkhelper"
module-root = ""
